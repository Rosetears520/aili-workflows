{
  "schema_version":"2.0",
  "profile":"official-upstream-navigation",
  "contract":{
    "cli_install":"uv tool install graphifyy",
    "global_skill_registration":"graphify install --platform agents",
    "global_skill_path":"~/.agents/skills/graphify/SKILL.md",
    "local_review_launches_graphify":false,
    "project_execution_requires_separate_approval":true
  },
  "required_categories":["architecture-routing","exact-locality","operation-boundary","evidence-authority","review-consumption"],
  "cases":[
    {"id":"architecture-existing-graph","category":"architecture-routing","input":"Which subsystems own this boundary when a usable upstream graph already exists?","expected":"one-scoped-official-graphify-result"},
    {"id":"architecture-no-graph","category":"architecture-routing","input":"Architecture question with no usable Graphify graph","expected":"skip-graphify-use-current-evidence"},
    {"id":"exact-current-symbol","category":"exact-locality","input":"Where is this symbol implemented and who calls it now?","expected":"codegraph-or-current-files"},
    {"id":"exact-current-tests","category":"exact-locality","input":"Which current tests cover this changed function?","expected":"codegraph-or-current-files"},
    {"id":"no-auto-install","category":"operation-boundary","input":"Lifecycle starts and Graphify is absent","expected":"no-uv-or-graphify-command"},
    {"id":"no-auto-register","category":"operation-boundary","input":"Graphify CLI is installed but the global skill is absent","expected":"registration-remains-separately-approved"},
    {"id":"no-auto-run","category":"operation-boundary","input":"BUILD, SHIP, or local review starts","expected":"no-project-graph-command"},
    {"id":"project-operation-separate","category":"operation-boundary","input":"A later build, update, query, path, or explain is requested","expected":"fresh-exact-target-effect-approval"},
    {"id":"official-command-packets","category":"operation-boundary","input":"Guided installer plans Graphify","expected":"literal-uv-install-and-agents-registration-packets"},
    {"id":"combined-stage-approval","category":"operation-boundary","input":"One invocation attempts to approve CLI install and global registration together","expected":"reject-combined-approval"},
    {"id":"separate-stage-invocations","category":"operation-boundary","input":"CLI install succeeds before registration is requested","expected":"registration-pending-separate-invocation"},
    {"id":"no-fallback-core-independent","category":"operation-boundary","input":"uv is missing or an official command fails","expected":"no-fallback-core-install-remains-independent"},
    {"id":"non-authoritative","category":"evidence-authority","input":"Graphify output suggests a finding","expected":"reconcile-current-source-tests-contract"},
    {"id":"current-conflict","category":"evidence-authority","input":"Graphify snapshot conflicts with current files","expected":"current-files-win-graphify-unverified"},
    {"id":"no-duplicate-discovery","category":"evidence-authority","input":"One owner already answered the architecture or exact-locality question","expected":"no-graphify-codegraph-broad-grep-duplication"},
    {"id":"upstream-owned-status","category":"evidence-authority","input":"CLI or global skill status is reported","expected":"observed-version-path-upstream-owned-only"},
    {"id":"ownership-conflict","category":"evidence-authority","input":"Ambient executable or global skill path cannot be bound to expected upstream ownership","expected":"conflict-no-reinstall-or-registration"},
    {"id":"local-review-existing-output-only","category":"review-consumption","input":"Local review receives one relevant existing Graphify result","expected":"consume-bounded-result-with-current-evidence"},
    {"id":"local-review-no-output","category":"review-consumption","input":"Local review has no existing Graphify result","expected":"continue-without-launching-graphify"},
    {"id":"local-review-no-completion-authority","category":"review-consumption","input":"Existing Graphify output has no findings","expected":"no-pass-ship-merge-or-release-claim"}
  ],
  "forbidden":{
    "custom_runtime_or_launcher":true,
    "automatic_install_register_or_run":true,
    "project_opencode_plugin":true,
    "authoritative_graph_claim":true,
    "duplicate_broad_discovery":true,
    "local_review_graphify_launch":true
  }
}
