name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Release checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Install Node dependencies
        run: npm ci

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          package_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          test "$tag_version" = "$package_version"

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit runtime dependencies
        run: npm audit --omit=dev

      - name: Check Bash installer syntax
        run: bash -n scripts/install_opencode.sh

      - name: Compile Python helpers
        run: python -m py_compile scripts/harness_fixture_check.py scripts/agents_md.py scripts/delegation_protocols_check.py scripts/workflow_contract_check.py scripts/upstream_reference_check.py

      - name: Run harness fixture check
        run: python scripts/harness_fixture_check.py

      - name: Check AGENTS.md template compliance
        run: python scripts/agents_md.py check --project .

      - name: Check A30 static permissions
        run: python scripts/delegation_protocols_check.py --profile permissions

      - name: Check pinned upstream references and installed catalog
        run: python scripts/upstream_reference_check.py --project . --manifest manifests/upstream-references.json --fixture docs/harness/fixtures/upstream-reference-fixtures.yaml --opencode-version 1.17.18 --verify-installed-catalog --json

      - name: Verify npm package contents
        run: npm pack --dry-run

  publish:
    name: Publish npm package
    needs: checks
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Install Node dependencies
        run: npm ci

      - name: Verify tag matches package version
        run: |
          package_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          test "$tag_version" = "$package_version"

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
